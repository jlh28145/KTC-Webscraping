# Dependency updates for GitHub Actions, with a 14-day cooldown to match `make lock`.
#
# Python packages are intentionally not here: requirements.txt is a lock produced by
# uv's resolver (`make lock`), and Dependabot bumps each pin on its own, which can
# produce sets that don't install (PR #26: pyarrow 26 vs streamlit's pyarrow<26).
# Refresh Python dependencies with `make lock` instead (monthly is plenty).
version: 2
updates:
  # Actions are pinned by commit SHA; Dependabot bumps the SHA and its version comment.
  # Note: a new actions/cache major can change the cache version and miss the stored
  # history; the scheduled scrape then restores it from the latest ktc-history artifact.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]
