name: CI

on:
  push:
    branches:
      - main
      - "phase-*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      KTC_TEST_POSTGRES_URL: postgresql://ktc:ktc@localhost:5432/ktc_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ktc
          POSTGRES_PASSWORD: ktc
          POSTGRES_DB: ktc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ktc -d ktc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Run pytest
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=90

      - name: Smoke-test the installed ktc-scrape entry point
        run: ktc-scrape --help
