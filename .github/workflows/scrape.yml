name: Scheduled Scrape

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      page_count:
        description: Pages to scrape. Keep 10 for a full snapshot; fewer replaces today's snapshot with a partial one
        required: false
        default: "10"
      start_fresh:
        description: Start a new history if neither the cache nor a ktc-history artifact has one
        type: boolean
        default: false

concurrency:
  group: scheduled-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # list and download ktc-history artifacts when the cache misses
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Prepare artifact directory
        run: mkdir -p artifacts

      # Each run saves its DB under a unique key; restore-keys picks up the most
      # recent one so ktc_rankings accumulates history across scheduled runs.
      # Keep this path unchanged: the cache version depends on it, and moving it
      # would orphan the existing history.
      - name: Restore historical database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: artifacts/ktc.db
          key: ktc-db-${{ github.run_id }}
          restore-keys: ktc-db-

      - name: Recover history from the latest ktc-history artifact
        if: hashFiles('artifacts/ktc.db') == ''
        env:
          GH_TOKEN: ${{ github.token }}
          START_FRESH: ${{ inputs.start_fresh || 'false' }}
        run: .github/scripts/restore-history.sh

      - name: Run scheduled scrape
        env:
          PAGE_COUNT: ${{ github.event.inputs.page_count || '10' }}
          KTC_DB_PATH: artifacts/ktc.db
        run: |
          echo "Starting scheduled scrape with PAGE_COUNT=${PAGE_COUNT}"
          ktc-scrape --page-count "${PAGE_COUNT}" --db-path "${KTC_DB_PATH}"

      # The scheduled-scrape-* artifact is a contract with a downstream repo that
      # commits its ktc.db to Git: it must stay one snapshot per file. The
      # full history (artifacts/ktc.db, also the cache path above) ships separately.
      - name: Publish latest snapshot and summary
        run: python -m ktc_webscraping.export --history artifacts/ktc.db --output-dir publish

      - name: Upload scrape artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: scheduled-scrape-${{ github.run_id }}
          path: publish/
          if-no-files-found: error
          retention-days: 14

      - name: Upload history database
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ktc-history-${{ github.run_id }}
          path: artifacts/ktc.db
          if-no-files-found: error
          retention-days: 14
